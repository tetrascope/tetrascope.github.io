name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests (Python ${{ matrix.python }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        node: ["20"]
        include:
          - {os: ubuntu-latest, python: "3.12", node: "18"}
          - {os: ubuntu-latest, python: "3.12", node: "22"}
          - {os: windows-latest, python: "3.12", node: "20"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - uses: actions/setup-node@v4
        with: {node-version: "${{ matrix.node }}"}
      - name: Install test dependencies
        run: python -m pip install "numpy>=1.20" "pytest>=7"
      - name: Generated browser assets are up to date (incl. service-worker cache name)
        run: python tools/build_definitions.py --check
      - name: Vendored libraries match their SHA-512 pins
        run: python tools/check_vendor.py
      - name: All test suites (browser tests run in the e2e job)
        run: python run_tests.py

  e2e:
    name: browser end-to-end (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - name: Install playwright-core (pinned) and Chromium
        run: |
          npm ci || npm install
          npx playwright-core install --with-deps chromium
      - name: Workflows - CSV upload, share link, exports, collection, offline
        env: {E2E_BROWSER: bundled}
        run: npm run e2e

  package:
    name: build and test the wheel
    needs: [test, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Install the wheel in a clean venv and run the installed CLI
        run: python tools/check_wheel.py --isolated
      - uses: actions/upload-artifact@v4
        with: {name: dist, path: dist/}

  release:
    name: publish a GitHub release (tags v*)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist}
      - name: Create release with the built packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # a release made on the website first is kept; the packages are added to it
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --generate-notes
          fi
